# mentorship-streamapi-java/.tmux-init.conf
# Builds this project's whole tmux session. sarisarinama's open-project runs
# it as a bash script with SESSION, selected_path and bash_path set, and it
# must create the session $SESSION itself.
#
# Same windows as the default session (agent, editor, terminal) plus a
# lazygit window, and the editor is nvim-java instead of nvim-base.
#
# Each app goes on the same line as `devenv shell`, so it starts once the env
# is ready, and quitting it leaves a shell behind. open-project has already
# built the devenv environment before this file runs.

# window <name> [command]: appends a window and types the command into it.
# The first call creates the session.
window() {
    local id
    if tmux has-session -t "=$SESSION" 2>/dev/null; then
        id="$(tmux new-window -d -P -F '#{window_id}' \
            -t "=$SESSION:" -n "$1" -c "$selected_path")"
    else
        id="$(tmux new-session -d -P -F '#{window_id}' \
            -s "$SESSION" -n "$1" -c "$selected_path")"
    fi
    tmux send-keys -t "$id" "devenv shell${2:+ $2}" C-m
}

window agent claude
window editor nvim-java
window terminal
window lazygit lazygit
